name: Compilar y publicar

# - pull_request / workflow_dispatch: prueba y compila los instaladores (artefactos del run).
# - etiqueta vX.Y.Z: además publica el release de GitHub con los instaladores.
on:
  push:
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Windows x64
            os: windows-latest
          - name: Linux x86_64
            os: ubuntu-22.04   # glibc 2.35: compatible con distribuciones actuales
    env:
      QT_QPA_PLATFORM: offscreen
      PYTHONUTF8: "1"
      PIP_DISABLE_PIP_VERSION_CHECK: "1"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Librerías del sistema (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q libegl1 libgl1 libxkbcommon-x11-0 libxcb-cursor0 \
            libxcb-icccm4 libxcb-keysyms1 libxcb-shape0 libxcb-xinerama0 libfontconfig1 libdbus-1-3

      - name: Dependencias (PyTorch CPU)
        shell: bash
        run: |
          python -m pip install --upgrade pip
          pip install torch==2.11.0 --index-url https://download.pytorch.org/whl/cpu
          pip install -r requirements.txt pyinstaller pytest pytest-qt

      - name: Versión
        id: version
        shell: bash
        run: |
          VERSION=$(python -c "import proteinfunc_app; print(proteinfunc_app.__version__)")
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          if [[ "$GITHUB_REF" == refs/tags/v* && "${GITHUB_REF#refs/tags/v}" != "$VERSION" ]]; then
            echo "La etiqueta ${GITHUB_REF#refs/tags/} no coincide con __version__ = $VERSION" >&2
            exit 1
          fi

      - name: Pruebas
        run: python -m pytest tests -q

      - name: Empaquetar con PyInstaller
        run: pyinstaller proteinfunc.spec --noconfirm

      - name: Verificar el ejecutable (sin red a Hugging Face)
        shell: bash
        working-directory: ${{ runner.temp }}
        run: |
          "$GITHUB_WORKSPACE/dist/ProteinFuncAI/proteinfunc-check" | tee check.log
          grep -q '"ok": true' check.log

      - name: Instalador de Windows
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $v = "${{ steps.version.outputs.version }}"
          New-Item -ItemType Directory -Force out | Out-Null
          Copy-Item installer\LEEME.txt dist\ProteinFuncAI\LEEME.txt
          Compress-Archive -Path dist\ProteinFuncAI -DestinationPath "out\ProteinFuncAI-$v-windows-x64-portable.zip"
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $iscc)) { choco install innosetup -y --no-progress; }
          & $iscc "/DMyAppVersion=$v" "/DDistDir=$PWD\dist\ProteinFuncAI" installer\windows\ProteinFuncAI.iss
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          Get-ChildItem out

      - name: Paquete de Linux
        if: runner.os == 'Linux'
        run: |
          v="${{ steps.version.outputs.version }}"
          name="ProteinFuncAI-$v-linux-x86_64"
          mkdir -p "stage/$name" out
          cp -a dist/ProteinFuncAI "stage/$name/ProteinFuncAI"
          cp installer/linux/install.sh installer/LEEME.txt proteinfunc_app/icon.png "stage/$name/"
          chmod +x "stage/$name/install.sh"
          tar -C stage -czf "out/$name.tar.gz" "$name"
          # Prueba del instalador en un HOME temporal.
          mkdir -p "$RUNNER_TEMP/home" && tar -C "$RUNNER_TEMP" -xzf "out/$name.tar.gz"
          HOME="$RUNNER_TEMP/home" "$RUNNER_TEMP/$name/install.sh"
          HOME="$RUNNER_TEMP/home" "$RUNNER_TEMP/home/.local/bin/proteinfunc-check" | grep -q '"ok": true'
          HOME="$RUNNER_TEMP/home" "$RUNNER_TEMP/$name/install.sh" --uninstall
          ls -la out

      - uses: actions/upload-artifact@v4
        with:
          name: instalador-${{ runner.os }}
          path: out/*
          if-no-files-found: error
          retention-days: 14

  release:
    name: Publicar release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          path: out
          merge-multiple: true

      - name: Crear release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          cd out
          sha256sum * > SHA256SUMS.txt
          cd ..
          VERSION="${TAG#v}"
          sed "s/VERSION/$VERSION/g" installer/RELEASE_NOTES.md > notes.md
          gh release create "$TAG" out/* --title "ProteinFunc AI Desktop $VERSION" --notes-file notes.md
